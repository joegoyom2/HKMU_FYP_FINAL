<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
</head>
<body>
    <h1>🔧 Admin Panel</h1>

    <h2>⚙️ Database Management</h2>
    <button onclick="resetDatabase()">🗑️ Reset Database</button>
    <button onclick="initializeDatabase()">🔄 Reinitialize Tables</button>

    <script>
        function resetDatabase() {
            if (confirm("⚠️ Are you sure you want to reset the database? All data will be deleted!")) {
                fetch('/reset_db', { method: 'POST' })
                .then(response => response.json())
                .then(data => alert(data.message || data.error))
                .catch(error => alert("❌ Unable to reset database：" + error));
            }
        }
        function initializeDatabase() {
            fetch('/initialize_db', { method: 'POST' })
            .then(response => response.json())
            .then(data => alert(data.error ? "❌ " + data.error : "✅ " + data.message))
            .catch(error => alert("❌ Connection Error：" + error));
        }
    </script>
</body>
</html>
